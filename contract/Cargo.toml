[package]
name = "fastlaunch-router"
version = "0.1.0"
edition = "2021"
description = "FastLaunch router: fair-launch, 1% (90/10) fee split, buyback, holder rewards, claim"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
primitive-types = { version = "0.12", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
# Integration (sandbox) test harness — near-workspaces spins a local `neard` sandbox, so these
# never touch the release cdylib wasm (dev-deps are excluded from the wasm32 build). `unstable`
# exposes `compile_project` used to build the in-repo mock DCL stub at test time.
near-workspaces = { version = "0.23", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
