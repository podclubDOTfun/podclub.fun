[package]
name = "fastlaunch-ft"
version = "0.1.0"
edition = "2021"
description = "FastLaunch launch token: a standard NEP-141 (fixed supply, no post-init mint) deployed one-per-launch by the factory."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"
primitive-types = { version = "0.12", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
